<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="frame-timing-title frame-timing-desc" id="frame-timing-root">
        <title id="frame-timing-title">一帧与一行的构成</title>
        <desc id="frame-timing-desc">同一个矩形的两个方向：纵向上，一帧共 VTS 2474 行，由有效图像 2448 行与 VBLANK 26 行组成；横向上，一行共 HTS 3880 个像素周期，由有效像素 3264 个与 HBLANK 616 个组成。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #frame-timing-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #frame-timing-root { font-family: var(--font-sans); color: var(--color-ink); }
      #frame-timing-root .diagram-container { width: 100%; overflow-x: auto; }
      #frame-timing-root .diagram-container { overflow-x: visible; }</style>
          <marker id="frame-timing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="frame-timing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="frame-timing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 一帧：外层矩形，纵向 = 有效图像 + VBLANK，横向 = 有效像素 + HBLANK -->
        <rect x="120" y="96" width="720" height="352" rx="8" fill="#2d3142" fill-opacity="0.015" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>

        <!-- 有效图像（同时就是每行的有效像素段） -->
        <rect x="144" y="128" width="564" height="232" rx="6" fill="#f5f5f5"/>
        <rect x="144" y="128" width="564" height="232" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="426" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">有效图像</text>
        <text x="426" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2448 rows × 3264 px</text>

        <!-- VBLANK：帧内纵向消隐 -->
        <rect x="144" y="360" width="564" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="144" y="360" width="564" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="426" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">VBLANK</text>
        <text x="426" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">26 rows</text>

        <!-- HBLANK：行内横向消隐，贯穿整帧高度 -->
        <rect x="708" y="128" width="108" height="296" rx="6" fill="#f5f5f5"/>
        <rect x="708" y="128" width="108" height="296" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="762" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">HBLANK</text>
        <text x="762" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">616 px</text>

        <!-- 一行：横跨整帧宽度的一条带（焦点），中缝即 有效像素 | HBLANK 的分界 -->
        <rect x="144" y="224" width="672" height="32" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
        <line x1="708" y1="224" x2="708" y2="256" stroke="#bf4520" stroke-width="1"/>
        <text x="480" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">一行 · HTS 3880</text>

        <!-- 环标签压在环的上边框上 -->
        <rect x="96" y="88" width="132" height="16" rx="2" fill="#f5f5f5"/>
        <text x="100" y="100" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">一帧 · VTS 2474 行</text>

        <!-- 编辑性注解（斜体衬线，共 2 条） -->
        <text x="120" y="496" fill="#5a6580" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif">帧率 = pixel_rate ÷ (HTS × VTS)</text>
        <text x="120" y="524" fill="#5a6580" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif">示意画法，非等比：VBLANK 实际只占 VTS 约 1%。</text>
      </svg>

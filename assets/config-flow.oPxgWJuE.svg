<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="config-flow-title config-flow-desc" id="config-flow-root">
        <title id="config-flow-title">从目标帧率反推 Sensor 配置</title>
        <desc id="config-flow-desc">流程图：从确定目标分辨率与帧率出发，依次查到 HTS 与 VTS、核对 pixel_rate、算出所需 link_freq，判断其是否超过 D-PHY 与 CSI2RX 上限；不超则选寄存器表写入设备树、再做反算校验，超过则增加 lane 数或降低帧率。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #config-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #config-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #config-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #config-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="config-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="config-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="config-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 连线先画，压在节点之下 -->
        <line x1="280" y1="152" x2="280" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#config-flow-arrow)"/>
        <line x1="280" y1="240" x2="280" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#config-flow-arrow)"/>
        <line x1="280" y1="328" x2="280" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#config-flow-arrow)"/>
        <path d="M 440,388 H 512 Q 520,388 520,380 V 172 Q 520,164 528,164 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#config-flow-arrow)"/>
        <line x1="720" y1="224" x2="720" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#config-flow-arrow)"/>
        <line x1="720" y1="312" x2="720" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#config-flow-arrow)"/>
        <line x1="720" y1="400" x2="720" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#config-flow-arrow)"/>
        <path d="M 840,164 H 888 Q 896,164 896,172 V 488 Q 896,496 888,496 H 288 Q 280,496 280,488 V 416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#config-flow-arrow)"/>

        <!-- 分支标注：遮罩与线保持 8px 净空 -->
        <rect x="728" y="232" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="740" y="244" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是</text>

        <rect x="852" y="140" width="24" height="16" rx="2" fill="#f5f5f5"/>
        <text x="864" y="152" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>

        <rect x="472" y="472" width="112" height="16" rx="2" fill="#f5f5f5"/>
        <text x="528" y="484" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">增 lane / 降帧率</text>

        <!-- 起点 -->
        <rect x="160" y="104" width="240" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="160" y="104" width="240" height="48" rx="20" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="280" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">确定目标分辨率与帧率</text>

        <!-- 步骤 -->
        <rect x="120" y="184" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="184" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">查模式表取 HTS / VTS</text>

        <rect x="120" y="272" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="272" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">核对 pixel_rate = HTS × VTS × 帧率</text>

        <rect x="120" y="360" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="360" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">算所需 link_freq</text>

        <!-- 判断（焦点：最关键的决策） -->
        <polygon points="720,104 840,164 720,224 600,164" fill="#f5f5f5"/>
        <polygon points="720,104 840,164 720,224 600,164" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
        <text x="720" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">link_freq 超上限?</text>

        <rect x="560" y="256" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="256" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="720" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">选寄存器表，写设备树与驱动</text>

        <rect x="560" y="344" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="344" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="720" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">反算校验（双向对齐）</text>

        <!-- 终点 -->
        <rect x="600" y="432" width="240" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="600" y="432" width="240" height="48" rx="20" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="720" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">配置自洽</text>
      </svg>
